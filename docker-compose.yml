services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: cybercafe_db
      POSTGRES_USER: cybercafe_user
      POSTGRES_PASSWORD: cybercafe_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "80:80"

volumes:
  postgres_data:
  static_volume:
  media_volume: